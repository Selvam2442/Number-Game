<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kids Number Match - Classic Perfect Edition</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            --panel-bg: rgba(255, 255, 255, 0.85);
            --cell-bg: #ffffff;
            --primary-color: #ff4757;
            --text-color: #2f3542;
        }

        * {
            touch-action: pan-x pan-y;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        /* BUBBLES */
        .bubbles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .bubble {
            position: absolute; bottom: -20px; background: rgba(255,255,255,0.4);
            border-radius: 50%; animation: floatUp 10s infinite ease-in;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
        }

        .kids-font { font-family: 'Fredoka One', cursive; text-shadow: 1px 1px 0px #fff; }

        /* START SCREEN */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 1000; 
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        /* START SCREEN LOGO */
        .start-logo {
            width: 220px;
            height: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 4px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            animation: pulseLogo 2s infinite;
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .bounce { animation: bounce 2s infinite; }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-25px); }
            60% { transform: translateY(-12px); }
        }

        .mode-toggle {
            background: #fff; border: 5px solid var(--primary-color); border-radius: 50px;
            padding: 8px 25px; font-size: 2rem; margin: 25px 0; box-shadow: 0 6px 0 var(--primary-color); 
            cursor: pointer; font-family: 'Fredoka One', cursive; display: flex; align-items: center; gap: 15px;
        }
        .mode-toggle:active { transform: translateY(6px); box-shadow: 0 0 0 var(--primary-color); }

        .btn-start {
            background: #ffa502; color: white; border: none; border-radius: 50px;
            padding: 12px 50px; font-size: 2.5rem; box-shadow: 0 8px 0 #e67e22;
            font-family: 'Fredoka One', cursive; cursor: pointer;
        }
        .btn-start:active { transform: translateY(8px); box-shadow: 0 0 0 #e67e22; }

        /* GAME LAYOUT */
        #main-game { height: 100vh; display: flex; flex-direction: column; padding: 10px 5px; position: relative; }

        .glass-header {
            background: var(--panel-bg); backdrop-filter: blur(10px); border-radius: 1rem;
            padding: 10px; box-shadow: 0 6px 12px rgba(0,0,0,0.1); border: 2px solid white;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; flex-shrink: 0; z-index: 10;
        }

        .header-info { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
        .score-text { font-size: 1.2rem; color:#ffa502; }
        .target-text { font-size: 1.2rem; color:#2ed573; }

        .btn-icon {
            width: 40px; height: 40px; border: none; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: white; box-shadow: 0 4px 0 rgba(0,0,0,0.2); cursor: pointer;
            margin: 0 2px;
        }
        .btn-icon:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0.2); }
        .btn-exit { background: #ff4757; }
        .btn-redo { background: #1e90ff; }
        .btn-shuffle { background: #9b59b6; }
        .btn-add { background: #2ed573; }

        /* BOARD */
        .board-container {
            flex-grow: 1; overflow-y: auto; overflow-x: hidden; display: flex;
            flex-direction: column; align-items: center; padding: 5px;
            -ms-overflow-style: none; scrollbar-width: none; touch-action: pan-y;
            padding-bottom: 60px; /* Space for watermark */
        }
        .board-container::-webkit-scrollbar { display: none; }
        .board-container::before { content: ''; margin-top: auto; }
        .board-container::after { content: ''; margin-bottom: auto; min-height: 80px; }

        #game-board {
            display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px;
            width: 100%; max-width: 550px; touch-action: none; flex-shrink: 0;
            transition: all 0.3s ease; 
        }

        .number-cell {
            aspect-ratio: 1; background: var(--cell-bg); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(1.2rem, 5vw, 1.8rem); font-family: 'Fredoka One', cursive; color: #3742fa;
            box-shadow: 0 4px 0 #dfe4ea; position: relative; z-index: 2;
            transition: transform 0.2s, background 0.2s;
        }

        .idle-wiggle { animation: wiggle 3s infinite; }
        @keyframes wiggle {
            0%, 90%, 100% { transform: rotate(0deg) scale(1); }
            92% { transform: rotate(5deg) scale(1.05); }
            96% { transform: rotate(-5deg) scale(1.05); }
        }

        .number-cell.selected {
            background: #ffeaa7; color: #ff4757; transform: scale(1.15) translateY(2px);
            box-shadow: 0 4px 0 #f5cd79; z-index: 5; border: 2px solid #ff4757; animation: none;
        }

        /* INVISIBLE CELLS FOR EMPTY SPACES */
        .number-cell.matched { visibility: hidden; pointer-events: none; }

        /* DRAG LINE */
        #drag-svg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; }
        #drag-line {
            stroke: #ff4757; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 12, 12;
            animation: flowDash 0.4s linear infinite; filter: drop-shadow(0 2px 4px rgba(255,71,87,0.5)); display: none;
        }
        @keyframes flowDash { to { stroke-dashoffset: -24; } }

        /* EFFECTS */
        .pop-anim { animation: popOut 0.4s ease forwards; }
        @keyframes popOut {
            0% { transform: scale(1); }
            50% { transform: scale(1.4) rotate(15deg); background: #2ed573; color: white; }
            100% { transform: scale(0) rotate(-15deg); opacity: 0; }
        }

        .shake { animation: shake 0.4s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); background: #ff4757; color: white; }
            75% { transform: translateX(5px) rotate(5deg); background: #ff4757; color: white; }
        }

        .drop-in { animation: dropIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; }
        @keyframes dropIn {
            0% { transform: translateY(-30px) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        .shuffle-anim { animation: shufflePop 0.5s ease-in-out forwards; }
        @keyframes shufflePop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.5) rotate(180deg); opacity: 0; }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }

        .floating-score {
            position: fixed; font-family: 'Fredoka One', cursive; color: #2ed573; font-size: 2.5rem; 
            pointer-events: none; z-index: 200; animation: floatScore 1s ease-out forwards; text-shadow: 2px 2px 0 #fff;
        }
        @keyframes floatScore {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.5); opacity: 0; }
        }

        /* CENTERED WATERMARK */
        .watermark {
            position: absolute; 
            bottom: 15px; 
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 15px; 
            border-radius: 30px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px;
            font-family: 'Fredoka One', cursive; 
            color: #747d8c; 
            font-size: 1.1rem;
            border: 2px solid white; 
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        /* MINI WATERMARK LOGO */
        .watermark-logo {
            width: 26px; 
            height: 26px; 
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .particle {
            position: fixed; pointer-events: none; font-size: 2rem;
            animation: fall 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; z-index: 105;
        }
        @keyframes fall {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="bubbles" id="bubble-container"></div>
<svg id="drag-svg"><line id="drag-line" x1="0" y1="0" x2="0" y2="0"></line></svg>

<div id="start-screen">
    <img src="image.png" alt="AABFC Logo" class="start-logo">

    <h1 class="kids-font bounce mb-2 text-center px-2" style="font-size: 3.2rem; color: #fff; text-shadow: 4px 4px 0 #ff4757;">
        <i class="fas fa-magic"></i> Number Magic
    </h1>
    <div class="mode-toggle" id="mode-btn" onclick="toggleMode()">
        <i class="fas fa-hand-pointer text-muted" style="font-size: 1.4rem;"></i>
        <span style="color: #2f3542;">Make <strong id="target-display-start" style="color:#ff4757; font-size:2.5rem;">5</strong></span>
    </div>
    <button class="btn-start mt-2" onclick="startGame()">PLAY!</button>
</div>

<div id="main-game" class="d-none">
    <div class="glass-header">
        <button class="btn-icon btn-exit" onclick="exitGame()"><i class="fas fa-home"></i></button>
        <div class="header-info kids-font">
            <div class="score-text"><i class="fas fa-star"></i> <span id="score-display">0</span></div>
            <div class="target-text">Make <span id="target-display-game">5</span></div>
        </div>
        <div>
            <button class="btn-icon btn-redo" onclick="initGame()"><i class="fas fa-redo"></i></button>
            <button class="btn-icon btn-shuffle" onclick="shuffleBoard()"><i class="fas fa-random"></i></button>
            <button class="btn-icon btn-add" onclick="addNumbers()"><i class="fas fa-plus"></i></button>
        </div>
    </div>
    
    <div class="board-container">
        <div id="game-board"></div>
    </div>
    
    <div class="watermark">
        <img src="logo.png" alt="AABFC Logo" class="watermark-logo">
        AABFC
    </div>
</div>

<script>
    // Prevent zooming
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        let now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
    }, false);
    document.addEventListener('touchmove', function(event) {
        if (event.scale !== 1 && event.scale !== undefined) event.preventDefault();
    }, { passive: false });

    // Bubbles
    const bubbleContainer = document.getElementById('bubble-container');
    for (let i=0; i<15; i++) {
        let b = document.createElement('div'); b.className = 'bubble';
        b.style.left = Math.random() * 100 + 'vw';
        b.style.width = b.style.height = (Math.random() * 30 + 10) + 'px';
        b.style.animationDuration = (Math.random() * 5 + 5) + 's';
        b.style.animationDelay = (Math.random() * 5) + 's';
        bubbleContainer.appendChild(b);
    }

    // Audio Engine
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, type, duration, vol = 0.1) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    const Sounds = {
        tap: () => playTone(600, 'sine', 0.1),
        match: () => { playTone(400, 'sine', 0.1); setTimeout(() => playTone(800, 'sine', 0.2), 100); },
        error: () => playTone(200, 'sawtooth', 0.2, 0.05),
        shuffle: () => { playTone(500, 'triangle', 0.1); setTimeout(() => playTone(700, 'triangle', 0.1), 100); },
        win: () => [400, 500, 600, 800, 1000].forEach((f, i) => setTimeout(() => playTone(f, 'square', 0.2), i * 100))
    };

    // GAME VARIABLES
    const COLS = 9;
    let numbers = [];
    let score = 0;
    let targetSum = 5;
    let isDragging = false;
    let dragStartIndex = null;
    let dragStartEl = null;

    const boardElement = document.getElementById('game-board');
    const scoreElement = document.getElementById('score-display');
    const dragLine = document.getElementById('drag-line');

    function toggleMode() {
        initAudio(); Sounds.tap();
        targetSum = (targetSum === 5) ? 10 : 5;
        document.getElementById('target-display-start').innerText = targetSum;
        document.getElementById('target-display-game').innerText = targetSum;
    }

    function startGame() {
        initAudio(); Sounds.win();
        document.getElementById('start-screen').style.transform = "translateY(-100vh)";
        setTimeout(() => {
            document.getElementById('start-screen').classList.add('d-none');
            document.getElementById('main-game').classList.remove('d-none');
            initGame();
        }, 600);
    }

    function exitGame() {
        Sounds.tap();
        document.getElementById('main-game').classList.add('d-none');
        document.getElementById('start-screen').classList.remove('d-none');
        document.getElementById('start-screen').style.transform = "translateY(0)";
    }

    function generateSolvableNumbers(pairCount) {
        let tempNums = [];
        let maxNum = targetSum - 1;

        for (let i = 0; i < pairCount; i++) {
            let n1 = Math.floor(Math.random() * maxNum) + 1;
            let n2 = targetSum - n1;
            
            let insertPos = Math.floor(Math.random() * (tempNums.length + 1));
            tempNums.splice(insertPos, 0, { value: n1, matched: false }, { value: n2, matched: false });
        }
        return tempNums;
    }

    function initGame() {
        Sounds.tap(); score = 0; dragStartIndex = null; updateScore();
        numbers = generateSolvableNumbers(18); 
        renderBoard(true);
    }

    function renderBoard(animateIn = false, isShuffle = false) {
        boardElement.innerHTML = '';
        numbers.forEach((item, index) => {
            const cell = document.createElement('div');
            cell.classList.add('number-cell');
            if (Math.random() > 0.6) cell.classList.add('idle-wiggle');
            cell.innerText = item.value;
            cell.dataset.index = index;
            
            if (item.matched) cell.classList.add('matched');

            if (animateIn && !item.matched) {
                cell.classList.add('drop-in');
                cell.style.animationDelay = `${(index % COLS) * 0.03}s`;
            }
            
            if (isShuffle && !item.matched) {
                cell.classList.add('shuffle-anim');
                cell.style.animationDelay = `${Math.random() * 0.2}s`;
            }

            if (dragStartIndex === index && !isDragging) cell.classList.add('selected');
            boardElement.appendChild(cell);
        });
    }

    function shuffleBoard() {
        if (numbers.length === 0) return;
        Sounds.shuffle();
        dragStartIndex = null;
        
        let visibleValues = [];
        numbers.forEach((item) => {
            if (!item.matched) {
                visibleValues.push(item.value);
            }
        });
        
        for (let i = visibleValues.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [visibleValues[i], visibleValues[j]] = [visibleValues[j], visibleValues[i]];
        }
        
        let valueIndex = 0;
        numbers.forEach((item) => {
            if (!item.matched) {
                item.value = visibleValues[valueIndex];
                valueIndex++;
            }
        });

        renderBoard(false, true);
    }

    function getEventPos(e) {
        if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        return { x: e.clientX, y: e.clientY };
    }

    boardElement.addEventListener('pointerdown', (e) => {
        const target = e.target.closest('.number-cell');
        if (!target || target.classList.contains('matched')) return; 
        initAudio();
        
        const index = parseInt(target.dataset.index);
        const pos = getEventPos(e);
        const rect = target.getBoundingClientRect();
        
        isDragging = true; dragStartEl = target;

        if (dragStartIndex === null) {
            dragStartIndex = index; Sounds.tap(); target.classList.add('selected');
        }

        const startX = rect.left + rect.width / 2; const startY = rect.top + rect.height / 2;
        dragLine.setAttribute('x1', startX); dragLine.setAttribute('y1', startY);
        dragLine.setAttribute('x2', pos.x); dragLine.setAttribute('y2', pos.y);
        dragLine.style.display = 'block';
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const pos = getEventPos(e);
        dragLine.setAttribute('x2', pos.x); dragLine.setAttribute('y2', pos.y);
    }, { passive: false });

    window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false; dragLine.style.display = 'none';

        const pos = getEventPos(e);
        const dropTarget = document.elementFromPoint(pos.x, pos.y)?.closest('.number-cell');
        
        if (dropTarget && !dropTarget.classList.contains('matched')) {
            const dropIndex = parseInt(dropTarget.dataset.index);
            if (dragStartIndex !== null) {
                if (dragStartIndex === dropIndex) {
                    if (dragStartEl !== dropTarget) {
                        Sounds.tap(); dragStartIndex = null; renderBoard();
                    }
                } else { attemptMatch(dragStartIndex, dropIndex, pos.x, pos.y); }
            }
        } else if (dragStartEl) { renderBoard(); }
    });

    function attemptMatch(i, j, x, y) {
        if (isValidPair(i, j)) {
            Sounds.match();
            let c1 = boardElement.children[i]; let c2 = boardElement.children[j];
            c1.classList.remove('selected'); c1.classList.add('pop-anim'); c2.classList.add('pop-anim');
            
            createParticles(x, y); showFloatingText(`+${targetSum}`, x, y);
            score += targetSum; updateScore(); dragStartIndex = null;

            setTimeout(() => {
                numbers[i].matched = true;
                numbers[j].matched = true;
                removeEmptyRows(); 
                renderBoard(); 
                checkWinStatus();
            }, 400); 
        } else {
            Sounds.error();
            let c1 = boardElement.children[i]; let c2 = boardElement.children[j];
            c1.classList.remove('selected'); c1.classList.add('shake'); c2.classList.add('shake');
            dragStartIndex = null; setTimeout(() => renderBoard(), 400); 
        }
    }

    function isValidPair(i, j) {
        const val1 = numbers[i].value; 
        const val2 = numbers[j].value;
        
        if (val1 + val2 !== targetSum) return false;

        let min = Math.min(i, j); 
        let max = Math.max(i, j);

        let isPathClear = true;
        for (let k = min + 1; k < max; k++) {
            if (!numbers[k].matched) {
                isPathClear = false;
                break;
            }
        }
        if (isPathClear) return true;

        if (min % COLS === max % COLS) {
            let isVerticalClear = true;
            for (let k = min + COLS; k < max; k += COLS) {
                if (!numbers[k].matched) {
                    isVerticalClear = false;
                    break;
                }
            }
            if (isVerticalClear) return true;
        }

        return false;
    }

    function removeEmptyRows() {
        let totalRows = Math.ceil(numbers.length / COLS);
        for (let r = totalRows - 1; r >= 0; r--) {
            let rowEmpty = true;
            for (let c = 0; c < COLS; c++) {
                let idx = r * COLS + c;
                if (idx < numbers.length && !numbers[idx].matched) { 
                    rowEmpty = false; 
                    break; 
                }
            }
            if (rowEmpty) numbers.splice(r * COLS, COLS);
        }
    }

    function addNumbers() {
        const unmatched = numbers.filter(n => !n.matched);
        if (unmatched.length === 0) return;
        
        Sounds.tap();
        
        unmatched.forEach(item => {
            numbers.push({ value: item.value, matched: false });
        });
        
        dragStartIndex = null; renderBoard(false);
        setTimeout(() => { 
            const container = document.querySelector('.board-container');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }, 50);
    }

    function updateScore() {
        scoreElement.innerText = score;
        scoreElement.classList.remove('bounce'); void scoreElement.offsetWidth; scoreElement.classList.add('bounce');
    }

    function checkWinStatus() {
        if (numbers.every(n => n.matched) && numbers.length > 0) {
            Sounds.win();
            setTimeout(() => { alert("🌟 YOU ARE A MATH GENIUS! 🌟\nFinal Score: " + score); initGame(); }, 500);
        }
    }

    function createParticles(x, y) {
        const emojis = ['⭐', '💖', '🎉', '🎈'];
        for (let i = 0; i < 6; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle'); particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            particle.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
            particle.style.left = (x - 20) + 'px'; particle.style.top = (y - 20) + 'px';
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 800);
        }
    }

    function showFloatingText(text, x, y) {
        const floater = document.createElement('div');
        floater.classList.add('floating-score'); floater.innerText = text;
        floater.style.left = (x - 20) + 'px'; floater.style.top = (y - 40) + 'px';
        document.body.appendChild(floater);
        setTimeout(() => floater.remove(), 1000);
    }
</script>

</body>
</html>
